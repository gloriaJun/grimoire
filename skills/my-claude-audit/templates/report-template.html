<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code 세션 감사 리포트</title>
    <style>
      :root {
        --bg: #f9f4ef;
        --surface: #fffcf9;
        --card: #ffffff;
        --border: #e8ddd5;
        --border-deep: #d0c4b8;
        --text: #232323;
        --text-sub: #716040;
        --text-muted: #a8957e;
        --accent: #e16449;
        --accent-dim: rgba(225,100,73,.10);
        --positive: #5a7a5a;
        --positive-bg: rgba(90,122,90,.10);
        --warning: #c47f35;
        --warning-bg: rgba(196,127,53,.10);
        --error: #b83232;
        --error-bg: rgba(184,50,50,.10);
        --info: #4a6fa5;
        --info-bg: rgba(74,111,165,.10);
        --radius: 8px;
        --radius-lg: 14px;
        --shadow: 0 1px 4px rgba(50,30,10,.07), 0 4px 16px rgba(50,30,10,.04);
        --shadow-md: 0 2px 8px rgba(50,30,10,.10), 0 8px 24px rgba(50,30,10,.06);
        --trans: .18s ease;
      }

      *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      button, input, textarea, select { font: inherit; }

      .page-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      /* ── Header ── */
      .hero-card {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 20px;
        margin-bottom: 24px;
        align-items: start;
      }
      .eyebrow { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); margin-bottom:6px; }
      .hero-title { font-size:1.45rem; font-weight:700; letter-spacing:-.3px; margin-bottom:4px; }
      .hero-subtitle { font-size:.85rem; color:var(--text-sub); line-height:1.6; margin-bottom:14px; }
      .meta-strip { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
      .mono { font-family:"SF Mono","Fira Code",monospace; font-size:.78rem; color:var(--text-muted); }

      /* ── Score area ── */
      .score-stack { display:flex; flex-direction:column; gap:14px; }
      .score-card {
        background:var(--card); border:1px solid var(--border);
        border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);
      }
      .score-topline { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; gap:10px; }
      .score-topline h3 { font-size:.85rem; font-weight:700; }
      .score-caption { font-size:.75rem; color:var(--text-muted); margin-top:2px; }

      /* Gauge SVG */
      .gauge-wrap { display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; }
      .gauge-svg { width:160px; height:108px; overflow:visible; display:block; }
      .gauge-track { fill:none; stroke:var(--border); stroke-width:10; stroke-linecap:round; }
      .gauge-progress { fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
      .gauge-score { font-size:2.4rem; font-weight:800; fill:var(--text); }
      .gauge-unit { font-size:1rem; font-weight:400; fill:var(--text-muted); }
      .gauge-label { font-size:.88rem; font-weight:700; color:var(--accent); margin-top:8px; text-align:center; }

      /* Dimension bars */
      .dimension-bars { }
      .section-kicker { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:12px; }
      .dimension-row { display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
      .dimension-row:last-child { border-bottom:none; }
      .dimension-label { display:flex; align-items:center; justify-content:space-between; }
      .dimension-label span { font-size:.82rem; color:var(--text-sub); }
      .dimension-label strong { font-size:.82rem; font-weight:700; margin-left:6px; flex-shrink:0; }
      .bar-track { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
      .bar-fill { height:100%; border-radius:3px; background:var(--positive); }

      /* ── Tabs ── */
      .tab-nav {
        display:flex; flex-wrap:wrap; gap:2px;
        border-bottom:2px solid var(--border); margin-bottom:24px;
      }
      .tab-btn {
        background:none; border:none; padding:9px 15px; font-size:.82rem;
        font-weight:500; color:var(--text-muted); cursor:pointer;
        border-radius:var(--radius) var(--radius) 0 0;
        transition:color var(--trans),background var(--trans);
        position:relative; white-space:nowrap;
      }
      .tab-btn:hover { color:var(--text-sub); background:var(--surface); }
      .tab-btn.active { color:var(--accent); font-weight:600; }
      .tab-btn.active::after {
        content:''; position:absolute; bottom:-2px; left:0; right:0;
        height:2px; background:var(--accent); border-radius:2px 2px 0 0;
      }
      .tab-panel { display:none; }
      .tab-panel.active { display:block; }

      /* ── Panels & sections ── */
      .panel-stack { }
      .panel-grid { display:flex; flex-direction:column; gap:16px; }
      .section-card {
        background:var(--card); border:1px solid var(--border);
        border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);
      }
      .section-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; gap:12px; }
      .section-head > div { flex:1; }
      .section-title { font-size:.98rem; font-weight:700; margin:2px 0; }
      .section-head p { font-size:.8rem; color:var(--text-sub); margin-top:3px; }
      h2.section-title { font-size:1rem; }

      /* ── Grid layouts ── */
      .split-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .tri-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
      .detail-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
      .inventory-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
      .skills-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

      /* ── Metric & summary cards ── */
      .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:4px; }
      .metric-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; }
      .metric-card .label { font-size:.72rem; color:var(--text-muted); margin-bottom:3px; }
      .metric-card .value { font-size:1.6rem; font-weight:800; line-height:1.1; }
      .metric-card .note { font-size:.72rem; color:var(--text-muted); margin-top:4px; }
      .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:12px 0; }
      .summary-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; text-align:center; }
      .summary-card .label { font-size:.68rem; color:var(--text-muted); }
      .summary-card .value { font-size:1.4rem; font-weight:800; margin:2px 0; }
      .summary-card .note { font-size:.68rem; color:var(--text-muted); }

      /* ── Finding cards ── */
      .finding-grid { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
      .finding-card {
        background:var(--card); border:1px solid var(--border);
        border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow);
        transition:box-shadow var(--trans);
      }
      .finding-card:hover { box-shadow:var(--shadow-md); }
      .card-topline { display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px 10px; gap:10px; }
      .card-title { font-size:.9rem; font-weight:600; padding:0 16px 4px; }
      .card-subtitle { font-size:.82rem; color:var(--text-sub); padding:0 16px 10px; line-height:1.5; }
      .file-ref { font-family:"SF Mono",monospace; font-size:.72rem; color:var(--text-muted); background:var(--surface); border-top:1px solid var(--border); padding:6px 16px; }
      .action-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-top:1px solid var(--border); }
      .action-block { background:var(--surface); padding:10px 14px; }
      .action-block span { display:block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:3px; }
      .action-block strong { font-size:.8rem; color:var(--text-sub); display:block; }
      .copy-btn {
        flex-shrink:0; background:none; border:1px solid var(--border-deep);
        border-radius:5px; padding:3px 10px; font-size:.68rem; color:var(--text-muted);
        cursor:pointer; transition:all var(--trans); white-space:nowrap;
      }
      .copy-btn:hover { background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

      /* ── Severity chips & pills ── */
      .sev-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
      .sev-chip { display:inline-flex; align-items:center; padding:2px 9px; border-radius:10px; font-size:.7rem; font-weight:700; }
      .sev-chip.critical { background:var(--error-bg); color:var(--error); }
      .sev-chip.warning { background:var(--warning-bg); color:var(--warning); }
      .sev-chip.info { background:var(--info-bg); color:var(--info); }

      .pill { display:inline-flex; align-items:center; padding:2px 9px; border-radius:10px; font-size:.7rem; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--text-sub); }
      .pill.positive { background:var(--positive-bg); color:var(--positive); border-color:transparent; }
      .pill.warning { background:var(--warning-bg); color:var(--warning); border-color:transparent; }
      .pill.error { background:var(--error-bg); color:var(--error); border-color:transparent; }
      .pill.info { background:var(--info-bg); color:var(--info); border-color:transparent; }
      .pill.accent { background:var(--accent-dim); color:var(--accent); border-color:transparent; }

      .meta-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
      .meta-tag-row { display:flex; flex-wrap:wrap; gap:5px; }
      .badge-row { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
      .meta-tag { display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-size:.68rem; font-weight:600; background:rgba(138,138,138,.08); color:var(--text-muted); border:1px solid var(--border); }
      .meta-tag.positive { background:var(--positive-bg); color:var(--positive); border-color:transparent; }
      .meta-tag.warning { background:var(--warning-bg); color:var(--warning); border-color:transparent; }
      .meta-tag.error { background:var(--error-bg); color:var(--error); border-color:transparent; }
      .meta-tag.info { background:var(--info-bg); color:var(--info); border-color:transparent; }
      .meta-tag.accent { background:var(--accent-dim); color:var(--accent); border-color:transparent; }
      .trigger-badge { display:inline-flex; align-items:center; padding:1px 7px; border-radius:5px; font-size:.68rem; font-family:"SF Mono",monospace; font-weight:700; background:var(--accent-dim); color:var(--accent); }
      .ref-badge { display:block; padding:1px 6px; border-radius:4px; font-size:.65rem; font-family:monospace; background:var(--info-bg); color:var(--info); width:fit-content; }
      .ref-badges { display:flex; flex-direction:column; gap:3px; margin-top:5px; }

      /* Tag badges for timeline/session */
      .tag-badge { display:inline-flex; align-items:center; padding:1px 7px; border-radius:6px; font-size:.62rem; font-weight:700; white-space:nowrap; }
      .tag-badge.critical { background:var(--error-bg); color:var(--error); }
      .tag-badge.warning { background:var(--warning-bg); color:var(--warning); }
      .tag-badge.info { background:var(--info-bg); color:var(--info); }
      .tag-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }

      /* ── Cards: info / skill / session / list ── */
      .info-card, .session-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
      .info-card strong { font-size:.85rem; font-weight:600; display:block; margin-bottom:3px; }
      .info-card .card-subtitle { font-size:.78rem; color:var(--text-sub); margin-top:2px; }
      .skill-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); transition:box-shadow var(--trans); }
      .skill-card:hover { box-shadow:var(--shadow-md); }
      .skill-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
      .skill-name { font-size:.9rem; font-weight:700; }
      .skill-desc { font-size:.78rem; color:var(--text-sub); line-height:1.5; margin-bottom:10px; }
      .list-stack { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
      .list-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
      .list-card strong { font-size:.85rem; font-weight:600; display:block; margin-bottom:3px; }
      .list-card p { font-size:.8rem; color:var(--text-sub); }

      /* ── Checklist ── */
      .checklist { display:flex; flex-direction:column; gap:8px; }
      .check-row { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
      .status-icon { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; flex-shrink:0; }
      .status-icon.positive { background:var(--positive-bg); color:var(--positive); }
      .status-icon.warning { background:var(--warning-bg); color:var(--warning); }
      .status-icon.error { background:var(--error-bg); color:var(--error); }
      .status-icon.info { background:var(--info-bg); color:var(--info); }
      .check-content { flex:1; }
      .check-content strong { font-size:.85rem; font-weight:600; display:block; }
      .check-content p { font-size:.78rem; color:var(--text-sub); margin-top:2px; }
      .status-badge { flex-shrink:0; padding:2px 9px; border-radius:8px; font-size:.68rem; font-weight:700; align-self:center; }
      .status-badge.positive { background:var(--positive-bg); color:var(--positive); }
      .status-badge.warning { background:var(--warning-bg); color:var(--warning); }
      .status-badge.error { background:var(--error-bg); color:var(--error); }
      .status-badge.info { background:var(--info-bg); color:var(--info); }

      /* ── Toggle sections ── */
      .toggle-section { border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
      .toggle-head { display:flex; align-items:center; justify-content:space-between; width:100%; padding:12px 16px; background:var(--surface); border:none; cursor:pointer; text-align:left; transition:background var(--trans); }
      .toggle-head:hover { background:var(--card); }
      .toggle-head strong { display:block; font-size:.85rem; font-weight:600; color:var(--text-sub); }
      .toggle-head span { font-size:.78rem; color:var(--text-muted); }
      .toggle-head > div { display:flex; flex-direction:column; gap:2px; }
      .toggle-caret { font-size:.75rem; color:var(--text-muted); flex-shrink:0; }
      .toggle-body { display:none; padding:16px; background:var(--card); border-top:1px solid var(--border); }
      .toggle-body.is-open { display:block; }

      /* ── Table ── */
      .table-card { border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; font-size:.8rem; }
      .table-head { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; padding:8px 14px; background:var(--surface); font-weight:700; font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); border-bottom:1px solid var(--border); }
      .table-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--card); transition:background var(--trans); }
      .table-row:last-child { border-bottom:none; }
      .table-row:hover { background:var(--surface); }
      .table-file strong { display:block; font-size:.8rem; }
      .table-cell { display:flex; align-items:center; font-size:.8rem; }

      /* ── Distribution bars ── */
      .distribution-list, .model-list { display:flex; flex-direction:column; gap:8px; }
      .distribution-row, .model-row { display:grid; grid-template-columns:120px 1fr 50px; gap:10px; align-items:center; font-size:.82rem; }
      .distribution-row span, .model-row span { color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .distribution-row strong, .model-row strong { text-align:right; font-weight:700; }

      /* ── Mini bars ── */
      .metric-note-list { display:flex; flex-direction:column; gap:10px; }
      .mini-bar-row { }
      .mini-bar-head { display:flex; align-items:center; justify-content:space-between; font-size:.82rem; margin-bottom:5px; }
      .mini-bar-head span { color:var(--text-sub); }
      .mini-bar-head strong { font-weight:700; }

      /* ── Session timeline ── */
      .timeline-layout { display:grid; grid-template-columns:1fr 180px; gap:16px; align-items:start; }
      .timeline-list { display:flex; flex-direction:column; gap:10px; }
      .timeline-row { display:grid; grid-template-columns:90px 1fr; gap:12px; align-items:center; }
      .timeline-meta strong { font-family:"SF Mono",monospace; font-size:.72rem; color:var(--text-muted); display:block; }
      .timeline-meta span { font-size:.72rem; color:var(--text-muted); }
      .timeline-track { height:28px; background:var(--surface); border-radius:6px; position:relative; overflow:hidden; border:1px solid var(--border); }
      .timeline-fill { height:100%; background:var(--accent-dim); border-radius:5px 0 0 5px; }
      .timeline-overlay { position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; gap:4px; }
      .legend-column { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
      .legend-item { display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--text-muted); }

      /* ── Priority matrix ── */
      .priority-matrix { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .quadrant { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); }
      .quadrant:nth-child(1) { border-top:3px solid var(--accent); }
      .quadrant:nth-child(2) { border-top:3px solid var(--info); }
      .quadrant:nth-child(3) { border-top:3px solid var(--warning); }
      .quadrant:nth-child(4) { border-top:3px solid var(--border-deep); }
      .quadrant h4 { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
      .quadrant:nth-child(1) h4 { color:var(--accent); }
      .quadrant:nth-child(2) h4 { color:var(--info); }
      .quadrant:nth-child(3) h4 { color:var(--warning); }
      .quadrant:nth-child(4) h4 { color:var(--border-deep); }
      .quadrant p { font-size:.75rem; color:var(--text-muted); margin-bottom:10px; }
      .quadrant-list { display:flex; flex-direction:column; gap:6px; }
      .quadrant-item { display:flex; align-items:flex-start; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); font-size:.8rem; line-height:1.4; }
      .quadrant-item:last-child { border-bottom:none; }
      .quadrant-item::before { content:'→'; color:var(--text-muted); flex-shrink:0; font-size:.7rem; margin-top:2px; }
      .quadrant-item strong { font-weight:600; color:var(--text-sub); display:block; }
      .quadrant-item span { font-size:.75rem; color:var(--text-muted); }

      /* ── Misc ── */
      .footnote { font-size:.78rem; color:var(--text-muted); margin-top:10px; line-height:1.5; }
      .empty-state { padding:32px; text-align:center; color:var(--text-muted); font-size:.88rem; border:1px dashed var(--border); border-radius:var(--radius-lg); background:var(--surface); }

      /* ── Responsive ── */
      @media (max-width:900px) {
        .hero-card { grid-template-columns:1fr; }
        .split-grid, .tri-grid, .skills-grid { grid-template-columns:1fr; }
        .timeline-layout { grid-template-columns:1fr; }
      }
      @media (max-width:760px) {
        .page-shell { padding:18px 14px 40px; }
        .metric-grid, .summary-grid { grid-template-columns:repeat(2,1fr); }
        .action-grid { grid-template-columns:1fr; }
        .priority-matrix { grid-template-columns:1fr; }
        .table-head, .table-row { grid-template-columns:1fr 1fr 1fr; }
        .gauge-wrap { grid-template-columns:1fr; }
      }

      /* === Mockup-faithful Layout: Header + Dashboard === */
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
      }
      .header-left h1 {
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--text);
        margin: 0 0 4px;
        letter-spacing: -.02em;
      }
      .header-meta {
        font-size: .85rem;
        color: var(--text-muted);
      }
      .header-right {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
        margin-top: 4px;
      }
      .badge-pill {
        padding: 5px 12px;
        border-radius: 999px;
        font-size: .78rem;
        font-weight: 600;
        border: 1.5px solid var(--border-deep);
        background: var(--card);
        color: var(--text-sub);
        white-space: nowrap;
      }
      .badge-pill.scope { border-color: var(--accent); color: var(--accent); }
      .badge-pill.model { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
      .badge-pill.mock  { border-color: var(--warning); color: var(--warning); }

      /* === Dashboard (Gauge + Dims) === */
      .dashboard {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 20px;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function safeObject(value) {
        return value && typeof value === "object" && !Array.isArray(value)
          ? value
          : {};
      }

      function num(value, fallback = 0) {
        return typeof value === "number" && Number.isFinite(value)
          ? value
          : fallback;
      }

      function clamp(value, min = 0, max = 100) {
        return Math.min(max, Math.max(min, num(value)));
      }

      function formatNumber(value, digits = 0) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return "-";
        }

        return value.toLocaleString("ko-KR", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        });
      }

      function formatPercent(value, digits = 1) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return "-";
        }

        return `${formatNumber(value, digits)}%`;
      }

      function formatRatioPercent(value, digits = 0) {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return "-";
        }

        const normalized = value <= 1 ? value * 100 : value;
        return formatPercent(normalized, digits);
      }

      function text(value, fallback = "-") {
        return value == null || value === "" ? fallback : String(value);
      }

      function scoreLabel(score) {
        const value = num(score);
        if (value >= 85) return "최우수";
        if (value >= 70) return "양호";
        if (value >= 55) return "보통";
        return "개선 필요";
      }

      function severityLabel(severity) {

      function copyPayload(textValue, button) {
        const payload = String(textValue ?? "");
        if (!payload.trim()) {
          return;
        }

        const complete = () => {
          if (!button) return;
          if (button.classList.contains("copy-icon-btn")) {
            button.classList.add("copied");
            window.setTimeout(() => button.classList.remove("copied"), 1200);
          } else {
            const original = button.dataset.label || "복사";
            button.textContent = "복사됨";
            window.setTimeout(() => { button.textContent = original; }, 1200);
          }
        };

        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(payload).then(complete).catch(() => {
            fallbackCopy(payload, complete);
          });
          return;
        }

        fallbackCopy(payload, complete);
      }

      function fallbackCopy(payload, done) {
        const textarea = document.createElement("textarea");
        textarea.value = payload;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          done?.();
        } finally {
          textarea.remove();
        }
      }

      // Adapter: normalize alternate schema (tokenBudget/configurationHealth) to expected schema
      function normalizeTokenAndConfig(raw) {
        if (!raw) return raw;
        if (raw.metrics && raw.tokenBreakdown && raw.configMap) return raw;

        const tb = safeObject(raw.tokenBudget);
        const gl = safeObject(tb.globalLayer);
        const transitive = safeObject(tb.transitiveReferences);
        const onDemand = safeObject(tb.onDemandReferences);
        const ch = safeObject(raw.configurationHealth);
        const hooksData = safeObject(ch.hooks);
        const cd = safeObject(raw.configDiscovery);
        const mcp = safeObject(raw.mcpDocumentation);
        const perms = safeObject(ch.permissions);

        const globalFiles = safeArray(gl.files);
        const configuredHooks = safeArray(hooksData.configuredHooks);

        const findings = [];
        safeArray(perms.overbroad).forEach(p =>
          findings.push({ severity: "warning", category: "permissions", title: "과도한 권한 패턴", detail: p })
        );
        if ((cd.customCommandsCount || 0) === 0)
          findings.push({ severity: "info", category: "config", title: "커스텀 명령어 없음",
            detail: "~/.claude/commands/에 명령어 파일이 없습니다.", suggestion: "자주 쓰는 워크플로를 명령어로 추가하면 편의성이 올라갑니다." });
        // summary.recommendations는 긍정적 메모이므로 findings로 표시하지 않음

        const breakdownGlobal = globalFiles.map(f => ({
          file: f.file || f.path || "",
          chars: f.bytes || 0,
          tokens: f.estimatedTokens || 0,
          contextPercent: f.percentOfWindow || 0,
          atRefs: [],
          transitiveTokens: 0,
        }));
        if (safeArray(transitive.files).length > 0)
          breakdownGlobal.push({ file: "(@-references) transitive imports", chars: 0,
            tokens: transitive.totalTransitiveTokens || 0, contextPercent: transitive.totalTransitivePercent || 0,
            atRefs: safeArray(transitive.files).map(f => f.file), transitiveTokens: transitive.totalTransitiveTokens || 0 });
        if (safeArray(onDemand.files).length > 0)
          breakdownGlobal.push({ file: "on-demand references", chars: 0,
            tokens: onDemand.totalOnDemandTokens || 0, contextPercent: onDemand.totalOnDemandPercent || 0,
            atRefs: safeArray(onDemand.files).map(f => f.file), transitiveTokens: 0 });

        const configured = safeArray(mcp.configuredMcpServers);
        const documented = safeArray(mcp.mcpFilesInGlobalClaude);

        return {
          ...raw,
          findings,
          metrics: {
            globalFiles: globalFiles.length,
            globalTotalTokens: gl.globalFilesTotalTokens || 0,
            globalContextPercent: gl.globalFilesPercentOfWindow || 0,
            projectTotalTokens: 0,
            projectContextPercent: 0,
            combinedContextPercent: tb.totalInstructionPercent || gl.globalFilesPercentOfWindow || 0,
            globalHooksCount: configuredHooks.length,
            projectHooksCount: 0,
            hookConflicts: 0,
            permissionsAllowCount: perms.allowRulesCount || 0,
            permissionsDenyCount: perms.denyRulesCount || 0,
            redundantPermissions: 0,
            overbroadPermissions: safeArray(perms.overbroad).length,
            semanticConflicts: 0,
            mcpDocumented: documented.length,
            mcpConfigured: configured.length,
            hasCustomCommands: (cd.customCommandsCount || 0) > 0,
            hasCustomAgents: (cd.customAgentsCount || 0) > 0,
            hasMemoryFiles: cd.hasMemoryFiles || false,
            customCommandsCount: cd.customCommandsCount || 0,
            customAgentsCount: cd.customAgentsCount || 0,
            missingHookScripts: 0,
          },
          tokenBreakdown: { global: breakdownGlobal, project: [] },
          configMap: {
            hooks: {
              global: configuredHooks.map(h => ({ event: h.trigger || "", matcher: "", command: h.command || h.script || "" })),
              project: [],
            },
            mcpAlignment: { documented, configured,
              documentedNotConfigured: documented.filter(d => !configured.includes(d)),
              configuredNotDocumented: configured.filter(c => !documented.includes(c)) },
            customCommands: [],
            customAgents: safeArray(cd.customAgents),
            memoryFiles: cd.hasMemoryFiles ? [`${cd.memoryFilesCount || 0}개 메모리 파일 (${cd.memoryProjects || 0}개 프로젝트)`] : [],
          },
        };
      }

        if (quality === "good") return "positive";

        if (quality === "good") return "양호";
        if (quality === "warning") return "주의";
        if (quality === "bad") return "미흡";
        return "미정";

        const base = String(name || "");
        if (/^g-/.test(base)) return "/g";

        if (base.includes(":")) return "plugin";
        return "direct";
      }

      function aggregateTags(sessionBreakdown, explicitTags) {
        const counts = {};
        safeArray(explicitTags).forEach((tag) => {
          counts[tag] = counts[tag] || 0;
        });

        safeArray(sessionBreakdown).forEach((session) => {
          safeArray(session?.anomalies).forEach((tag) => {
            counts[tag] = (counts[tag] || 0) + 1;
          });
        });

        return Object.entries(counts);
      }

      function renderSessionTimeline(sessions) {
        const list = safeArray(sessions);
        if (!list.length) {
          return emptyState();
        }

        const TAG_CLASS = {
          TAG_ONESHOT_OVERLOAD: "tag-oneshot",
          TAG_CTX_HOARD: "tag-ctx",
          TAG_SILENT_FIX: "tag-silent",
          TAG_BLIND_FOLLOW: "tag-blind",
          TAG_OPUS_SUBAGENT: "tag-opus",
        };

        const maxTurns = Math.max(...list.map((s) => num(s?.turns)), 1);

        return `
          <div class="timeline-grid">
            ${list
              .map((session) => {
                const turns = num(session?.turns);
                const width = Math.round((turns / maxTurns) * 100);
                return `
                  <div class="tl-row">
                    <div class="tl-id">${escapeHtml(text(session?.sessionId).slice(0, 8))}</div>
                    <div class="tl-bar-outer">
                      <div class="tl-bar-fill" style="width:${width}%;"></div>
                      <div class="tl-tags">
                        ${safeArray(session?.anomalies)
                          .map((tag) => {
                            const cls = TAG_CLASS[tag] || "tag-info";
                            return `<span class="tl-tag ${cls}">${escapeHtml(tagLabel(tag))}</span>`;
                          })
                          .join("")}
                      </div>
                    </div>
                    <div class="tl-turns">${escapeHtml(formatNumber(turns))}턴</div>
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

                      <article class="info-card">
                        <strong>권장 처방</strong>
                        <p class="card-subtitle">${escapeHtml(text(sessionInsights.prescription))}</p>
                        <div class="meta-tags">
                          ${safeArray(sessionInsights.instructionPatches)
                            .map((item) => createMetaTag(item, "accent"))
                            .join("")}
                        </div>
                      </article>
                    </div>`
                  : emptyState()
              }
            </section>
          </div>
        `;
      }

      function splitRecommendations(recommendations) {
        const groups = { tl: [], tr: [], bl: [], br: [] };
        safeArray(recommendations).forEach((item) => {
          const severity = item?.severity || "info";
          const effort = item?.effort || "medium";
          if (severity === "critical" && effort === "easy") {
            groups.tl.push(item);
          } else if (severity === "critical") {
            groups.tr.push(item);
          } else if (effort === "easy") {
            groups.bl.push(item);
          } else {
            groups.br.push(item);
          }
        });
        return groups;
      }

      function renderQuadrant(title, description, items) {
        const list = safeArray(items);
        return `
          <div class="matrix-cell">
            <h4>${escapeHtml(title)}</h4>
            ${
              list.length
                ? list
                    .map(
                      (item) =>
                        `<div class="matrix-item">→ ${escapeHtml(text(item.title))}</div>`,
                    )
                    .join("")
                : emptyState()
            }
          </div>
        `;
      }

      function insightTypeLabel(type) {
        if (type === "gap") return "격차";
        if (type === "overlap") return "중복";
        if (type === "complement") return "보완";
        return "기타";
      }

      function insightTypeTone(type) {
        if (type === "gap") return "warning";
        if (type === "overlap") return "info";
        if (type === "complement") return "positive";
        return "info";
      }

      function renderImprovementSummary() {
        const root = document.getElementById("panel-improvement-summary");
        const section = data.insights;
        if (!isMeaningful(section)) {
          root.innerHTML = emptyState();
          return;
        }

        const score = safeObject(section.optimizationScore ?? section.auditScore);
        const recommendations = safeArray(section.recommendations);
        const matrix = splitRecommendations(recommendations);

        root.innerHTML = `
          <div class="panel-grid">
            <div class="section-head">
              <h2>개선 우선순위 매트릭스</h2>
              <span class="matrix-axis-hint">영향(세로) × 적용 난이도(가로)</span>
            </div>
            <div class="matrix-wrap">
              ${renderQuadrant("🎯 즉시 적용", "", matrix.tl)}
              ${renderQuadrant("🔬 전략적 개선", "", matrix.tr)}
              ${renderQuadrant("⚡ 빠른 개선", "", matrix.bl)}
              ${renderQuadrant("📋 나중에", "", matrix.br)}
            </div>
            <div class="matrix-axis-label">← 적용 어려움 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 적용 쉬움 →</div>

            ${renderToggle(
              "즉시 기억할 포인트",
              "보너스 · 감점 · 세션 처방 요약",
              `
                <div class="list-stack">
                  <div class="list-card">
                    <strong>보너스</strong>
                    <p>${escapeHtml(safeArray(score.bonuses).join(" / ") || "-")}</p>
                  </div>
                  <div class="list-card">
                    <strong>감점</strong>
                    <p>${escapeHtml(safeArray(score.deductions).join(" / ") || "-")}</p>
                  </div>
                  <div class="list-card">
                    <strong>세션 처방</strong>
                    <p>${escapeHtml(text(section.sessionInsights?.prescription, "-"))}</p>
                  </div>
                </div>
              `,
              false,
            )}

            ${renderFindingsGrid(
              section.findings,
              "추가 개선 발견",
              "자동화와 운영 흐름에서 남아 있는 구조적 개선점을 정리합니다.",
            )}

            ${renderFindingsGrid(
              recommendations,
              "권장 조치",
              "실행 가능한 액션 중심으로 정리한 개선 권장안입니다.",
              "recommendation",
            )}

            <div class="split-grid">
              <section class="section-card">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">Commands</div>
                    <h3 class="section-title">놓친 명령</h3>
                    <p>이미 존재하지만 세션에서 충분히 활용되지 않은 명령입니다.</p>
                  </div>
                </div>
                ${
                  safeArray(section.missedCommands).length
                    ? `<div class="list-stack">${safeArray(section.missedCommands)
                        .map(
                          (item) => `
                            <article class="list-card">
                              <strong>${escapeHtml(text(item.command))}</strong>
                              <p>${escapeHtml(text(item.description))}</p>
                              <div class="meta-tags">
                                ${createMetaTag(`효과 ${text(item.benefit)}`, "positive")}
                                ${createMetaTag(`조치 ${text(item.fix)}`, "accent")}
                              </div>
                            </article>
                          `,
                        )
                        .join("")}</div>`
                    : emptyState()
                }
              </section>

              <section class="section-card">
                <div class="section-head">
                  <div>
                    <div class="section-kicker">Automation</div>
                    <h3 class="section-title">자동화 기회</h3>
                    <p>수동 작업을 반복 실행 가능한 흐름으로 바꾸는 후보입니다.</p>
                  </div>
                </div>
                ${
                  safeArray(section.automationOpportunities).length
                    ? `<div class="list-stack">${safeArray(section.automationOpportunities)
                        .map(
                          (item) => `
                            <article class="list-card">
                              <strong>${escapeHtml(text(item.current))} → ${escapeHtml(text(item.suggested))}</strong>
                              <p>${escapeHtml(text(item.benefit))}</p>
                              <div class="meta-tags">
                                ${createMetaTag(`난이도 ${effortLabel(item.effort)}`, "warning")}
                              </div>
                            </article>
                          `,
                        )
                        .join("")}</div>`
                    : emptyState()
                }
              </section>
            </div>
          </div>
        `;
      }

      function bindInteractions() {
        document.addEventListener("click", (event) => {
          const tabButton = event.target.closest(".tab-btn");
          if (tabButton) {
            activateTab(tabButton.dataset.tab);
            return;
          }

          const copyButton = event.target.closest(".copy-btn, .copy-icon-btn");
          if (copyButton) {
            copyPayload(copyButton.dataset.copy, copyButton);
            return;
          }

          const toggleHead = event.target.closest(".toggle-head");
          if (toggleHead) {
            const body = toggleHead.nextElementSibling;
            const isOpen = body?.classList.contains("is-open");
            body?.classList.toggle("is-open", !isOpen);
            toggleHead.setAttribute("aria-expanded", String(!isOpen));
            const caret = toggleHead.querySelector(".toggle-caret");
            if (caret) {
              caret.textContent = isOpen ? "열기" : "접기";
            }
          }
        });
      }

      function init() {
        renderPageHeader();
        renderTabs();
        renderTokenAndConfig();
        renderSkillsEcosystem();
        renderConfigState();
        renderAgentUsage();
        renderSessionAnalysis();
        renderImprovementSummary();
        activateTab(TAB_DEFS[0].id);
        bindInteractions();
      }

      init();
    </script>
  </body>
</html>
